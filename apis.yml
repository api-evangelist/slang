aid: slang
name: Slang
description: >-
  Slang (Slang.ai) is a New York-based voice AI company building "the AI
  Superhost for Restaurants" — a 24/7 AI phone concierge that answers restaurant
  calls, responds to guest questions, captures missed calls, and routes callers
  to reservations and ordering. It integrates with hospitality platforms
  including OpenTable, SevenRooms, Yelp, Olo, Tripleseat, and Google. Backed by
  Homebrew and Techstars, Slang is SOC 2 Type II compliant and publishes a
  Drata-hosted trust center. Slang is a product/SaaS company; as of this
  enrichment pass it exposes no public developer API, SDKs, OpenAPI, or
  developer documentation surface.
